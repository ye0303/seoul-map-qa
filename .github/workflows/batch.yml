name: 검사 배치

# 필요할 때 Actions 탭에서 Run workflow로 실행한다(자동 예약 없음).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch
  cancel-in-progress: false

jobs:
  batch:
    name: 공개 테마 수집·검사 후 결과 커밋
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 버전 목록은 실행마다 붙는 태그로 과거 파일을 가리킨다. 태그 도입 전(M2) 실행이면 지금 태그를 붙여 둔다.
      - name: 직전 실행 태그 확인
        run: |
          if [ ! -f data/run.json ]; then exit 0; fi
          tag=$(node -p "const r = require('./data/run.json'); r.tag ?? 'snap-' + r.runId.replace('T', '-').replace(':', '')")
          if [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
      - name: 수집·검사
        run: pnpm batch
        env:
          SMART_SEOUL_THEME_KEY: ${{ secrets.SMART_SEOUL_THEME_KEY }}
      - name: 결과 커밋과 태그
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없습니다."
            exit 0
          fi
          git commit -m "chore(data): 검사 결과 갱신 $(node -p "require('./data/run.json').runId")"
          tag=$(node -p "require('./data/run.json').tag")
          git tag "$tag"
          git push --atomic origin HEAD "refs/tags/$tag"
